color:var(--muted);font-size:14px}.summary strong{color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover:not(:disabled){background:#104d93;color:white}.notice{font-size:14px;min-height:24px;margin-top:12px;color:var(--muted)}.notice.error{color:var(--red)}.auto-score{background:#eef7ff;border-color:#7baee0}.deduction-wrap{display:flex;align-items:center;gap:2px}.deduction{padding:7px 3px}.deduction-trigger{padding:6px 9px;font-size:13px;color:var(--red);border-color:#e6a8b1;background:#fff5f6}.deduction-trigger:hover:not(:disabled){color:#991e31;border-color:var(--red);background:#ffe9ec}.empty{padding:33px 20px;text-align:center;color:var(--muted)}.game{padding:16px 20px;border-bottom:1px solid var(--line)}.game:last-child{border:0}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.game-title{font-weight:650;overflow-wrap:anywhere}.game-id{font:13px ui-monospace,monospace;color:var(--muted);margin-right:10px}.game-tools{display:flex;gap:6px;flex-shrink:0}.game-players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;font-size:14px}.game-players div{background:#f5f8fb;padding:9px;border-radius:5px}.game-players span{display:block}.danger{color:var(--red)}[hidden]{display:none!important}.list-actions{display:flex;align-items:center;gap:12px}.footer-note{font-size:14px;color:var(--muted);padding:0 2px}
/* 录入表格的表头、文本及输入值统一左对齐。 */

@media(max-width:760px){header{padding:12px 16px}h1{font-size:21px}main{display:flex;flex-direction:column;margin-top:10px}.panel,.workspace{width:100%}.roster{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;max-height:290px;overflow:auto}.panel-head{padding:12px}.game{padding:12px}.entry-grid{grid-template-columns:4fr 4fr 1fr 2fr 2fr;gap:3px}.player-row{padding:7px 1px}.pick-row{padding:7px 2px;gap:2px;font-size:12px}.score,.deduction{padding:7px 4px}.table-labels{padding-left:2px;padding-right:2px}.summary{flex-wrap:wrap}.list-actions{gap:6px}.name-btn{font-size:13px}.game-top{align-items:flex-start}}

<body>
<header><h1>麻将比赛录入</h1></header>
<main>
<aside class="panel"><div class="panel-head"><h2>选手名单</h2><button id="import-teams" class="small">更换名单</button><input id="teams-file" type="file" accept=".json,application/json" hidden></div><div style="padding:8px 12px 0" class="sub">点击队伍展开，点击名字填入。</div><div id="roster" class="roster"></div></aside>
<div class="workspace">
<section class="panel"><div class="panel-head"><h2 id="editor-title">录入新比赛</h2><div class="list-actions"><span id="game-id" class="sub"></span><button id="import-games" class="small" type="button">导入文件</button><input id="games-file" type="file" accept=".json,application/json" hidden></div></div>
<div class="editor-body">
<label for="info" class="info-label">比赛信息 · info</label><input id="info" type="text" placeholder="例如：9月26日 第一场" autocomplete="off">
<div class="entry-grid table-labels"><span>选手 · name</span><span class="num">最终持点 · score</span><span class="rank">顺位</span><span class="num">特殊扣分</span><span class="num">积分</span></div>
<div id="rows"></div>
<div id="tie-box" class="tie-box" hidden><strong>三人同分：请补充起家顺序</strong><p>选择开局时的座次。按东→南→西→北确定同分选手的余数分配顺序。</p><div id="seats" class="seat-grid"></div><p id="tie-detail" style="margin-bottom:0"></p></div>
<div class="summary"><span>持点合计 <strong id="score-total">—</strong></span><button id="correct-score" class="small" type="button">自动修正</button></div>
<div class="actions"><button id="save" class="primary">保存本场，继续录入</button><button id="reset">清空本场</button><button id="cancel" hidden>取消修改</button></div>
<p id="calculation-status" class="sub" role="status" aria-live="polite" style="margin-top:12px" hidden></p>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
</div>
</section>
<section class="panel"><div class="panel-head"><h2>已保存 <span id="count">0</span> 场</h2><div class="list-actions"><button id="download" class="primary small" disabled>下载 games.json</button></div></div><div id="games-list"></div></section>
<p class="footer-note">数据保留在当前页面中，关闭前请下载。修改和删除比赛不会改变其他比赛的编号。</p>
</div>
</main>
<script id="team-data" type="application/json">{"teams": [{"name": "EX风林火山", "shortName": "火山", "color": "#000000", "initialScore": 0, "players": ["二阶堂亚树", "胜又健志", "内川幸太郎", "永井孝典"]}, {"name": "科乐美麻将格斗俱乐部", "shortName": "格斗", "color": "#920101", "initialScore": 0, "players": ["佐佐木寿人", "泷泽和典", "高宫茉莉", "伊达朱里纱"]}, {"name": "野兽X", "shortName": "野兽", "color": "#002953", "initialScore": 0, "players": ["铃木大介", "中田花奈", "下石戟", "东城理央"]}, {"name": "赤坂驱动力", "shortName": "赤坂", "color": "#9cb832", "initialScore": 0, "players": ["园田贤", "铃木太郎", "渡边太", "浅见真纪"]}, {"name": "U-NEXT海盗", "shortName": "海盗", "color": "#0582c8", "initialScore": 0, "players": ["仲林圭", "瑞原明奈", "铃木优", "朝仓康心"]}, {"name": "地球喷射机", "shortName": "地球", "color": "#006934", "initialScore": 0, "players": ["石井一马", "HIRO柴田", "三浦智博", "逢川惠梦"]}, {"name": "角川樱花骑士", "shortName": "樱花", "color": "#f895b5", "initialScore": 0, "players": ["堀慎吾", "冈田纱佳", "阿久津翔太", "尻无滨航"]}, {"name": "雷电", "shortName": "雷电", "color": "#dbb400", "initialScore": 0, "players": ["萩原圣人", "濑户熊直树", "本田朋广", "黑泽咲"]}, {"name": "涩谷ABEMAS", "shortName": "AB", "color": "#c6ae6f", "initialScore": 0, "players": ["多井隆晴", "松本吉弘", "白鸟翔", "日向蓝子"]}, {"name": "世嘉飒美凤凰", "shortName": "凤凰", "color": "#b74801", "initialScore": 0, "players": ["茅森早香", "竹内元太", "醍醐大", "佐野日向子"]}]}</script>
<script>
'use strict';
// 单文件离线页面：名单内置，导出时自动补充每天首场的 labelx。
const $ = id => document.getElementById(id);
let teams = JSON.parse($('team-data').textContent).teams;
let games = [], nextId = 0, editingId = null, activeRow = 0, unsaved = false, autoScoreIndex = null, openTeamName = null;
let players = emptyPlayers(), savingFile = false;
const seatNames = ['东（起家）','南','西','北'];
const seatHistory = new Map(); // 仅用于本页重新编辑，绝不导出额外字段。
function emptyPlayers(){return Array.from({length:4},()=>({name:'',score:'25000',seat:'',deduction:'',deductionOpen:false}));}
function teamFor(name){return teams.find(team=>team.players.includes(name));}
function validDeduction(value){return String(value).trim()===''||(Number.isFinite(Number(value))&&Number(value)>=0);}
function el(tag, text, className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function notify(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error);}
function formatPoint(value){return (value>0?'+':'')+value.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:3});}
function validScore(value){return String(value).trim()!=='' && Number.isSafeInteger(Number(value)) && Math.abs(Number(value))<=1000000000;}

// 以整数点分配顺位点，最后除以 1000，避免浮点余数影响分配。
function calculate(input){
  if(!input.every(p=>validScore(p.score)))return {ready:false,error:'请填写四人的整数持点（允许负数）。'};
  const ordered=input.map((p,i)=>({index:i,score:Number(p.score)})).sort((a,b)=>b.score-a.score);
  const rankPoints=[50000,10000,-10000,-30000];
  const result=Array(4);let hasTriple=false,needsSeats=false,tripleBonus=[];
  for(let start=0;start<4;){
    let end=start+1;while(end<4&&ordered[end].score===ordered[start].score)end++;
    const group=ordered.slice(start,end),count=group.length;
    const total=rankPoints.slice(start,end).reduce((a,b)=>a+b,0);
    let bonuses=Array(count).fill(total/count);
    if(count===3){
      hasTriple=true;
      const seats=input.map(p=>p.seat);
      const validSeats=seats.every(s=>s!==''&&Number.isInteger(Number(s))&&Number(s)>=0&&Number(s)<4)&&new Set(seats.map(Number)).size===4;
      if(!validSeats){needsSeats=true;bonuses=Array(count).fill(null);}
      else{
        group.sort((a,b)=>Number(input[a.index].seat)-Number(input[b.index].seat));
        const base=Math.floor(total/(count*1000))*1000;
        const remainder=total-base*count;
        // 余下 1000 → 400/300/300；余下 2000 → 800/600/600。
        const extra=remainder===2000?[800,600,600]:remainder===1000?[400,300,300]:[0,0,0];
        bonuses=extra.map(v=>base+v);
        tripleBonus=group.map((item,j)=>({name:input[item.index].name,bonus:bonuses[j]/1000}));
      }
    }
    group.forEach((item,j)=>{result[item.index]={rank:start+1,tied:count>1,bonus:bonuses[j]===null?null:bonuses[j]/1000,point:bonuses[j]===null?null:(item.score-30000+bonuses[j])/1000};});
    start=end;
  }
  return {ready:!needsSeats,hasTriple,needsSeats,result,tripleBonus,error:needsSeats?'三人同分，请为四位选手选择互不重复的开局座次。':''};
}
function renderRoster(){
  $('roster').replaceChildren();
  teams.forEach(team=>{
    const section=el('details',undefined,'team'),heading=el('summary',undefined,'team-title');
    section.open=team.name===openTeamName;
    section.addEventListener('toggle',()=>{if(section.open){openTeamName=team.name;document.querySelectorAll('.team[open]').forEach(item=>{if(item!==section)item.open=false;});}else if(openTeamName===team.name)openTeamName=null;});
    section.style.setProperty('--team-color',/^#[0-9a-f]{6}$/i.test(team.color)?team.color:'#647587');
    const swatch=el('span',undefined,'swatch');swatch.style.background=/^#[0-9a-f]{6}$/i.test(team.color)?team.color:'#647587';
    heading.append(swatch,el('span',team.name));section.append(heading);
    const names=el('div',undefined,'names');
    team.players.forEach(name=>{
      const selected=players.some(p=>p.name===name),button=el('button',name,'name-btn'+(selected?' selected':''));
      button.disabled=selected;button.addEventListener('click',()=>pickName(name));names.append(button);
    });
    section.append(names);$('roster').append(section);
  });
}
function pickName(name){
  players[activeRow].name=name;
  players.forEach(p=>p.seat='');
  const empty=players.findIndex(p=>!p.name);if(empty>=0)activeRow=empty;
  openTeamName=null;
  renderRows();renderRoster();updateCalculation();notify('');
}
// 只更新选择状态，避免重绘导致输入框失去焦点。
function selectRow(index){
  activeRow=index;
  document.querySelectorAll('.player-row').forEach(row=>row.classList.toggle('active',Number(row.dataset.row)===index));
  $('correct-score').disabled=false;
}
function renderRows(){
  $('rows').replaceChildren();
  players.forEach((player,index)=>{
    const row=el('div',undefined,'entry-grid player-row'+(activeRow===index?' active':''));row.dataset.row=index;
    // 捕获阶段先选中，让行内控件的后续操作作用于正确的选手。
    row.addEventListener('pointerdown',()=>selectRow(index),true);
    row.addEventListener('click',()=>selectRow(index),true);
    row.addEventListener('focusin',()=>selectRow(index));
    const pick=el('button',undefined,'pick-row');pick.setAttribute('aria-label',`选择第 ${index+1} 行选手`);
    const playerTeam=teamFor(player.name);if(playerTeam){const color=/^#[0-9a-f]{6}$/i.test(playerTeam.color)?playerTeam.color:'#647587';pick.classList.add('has-team');pick.style.setProperty('--player-team-color',color);pick.title=playerTeam.name;}
    pick.append(el('span',String(index+1).padStart(2,'0'),'row-index'),el('span',player.name||'点击左侧名字',player.name?'':'empty-name'));
    const score=el('input',undefined,'score num'+(autoScoreIndex===index?' auto-score':''));score.type='number';score.step='100';score.value=player.score;score.placeholder='如 35800';score.setAttribute('aria-label',`${player.name||'选手'+(index+1)}的最终持点`);
    score.addEventListener('input',()=>{if(autoScoreIndex===index)autoScoreIndex=null;player.score=score.value;autoFillScore(index);updateCalculation();});
    score.addEventListener('wheel',event=>{if(!event.deltaY)return;event.preventDefault();if(autoScoreIndex===index)autoScoreIndex=null;const current=validScore(score.value)?Number(score.value):0;score.value=String(current+(event.deltaY<0?100:-100));player.score=score.value;autoFillScore(index);updateCalculation();},{passive:false});
    const rank=el('span','—','rank');rank.id='rank-'+index;
    const point=el('span','—','point num');point.id='point-'+index;
    const deductionBox=el('div',undefined,'deduction-wrap');
    // 只替换本行扣分控件，失焦收起时不重建其他正在接收点击或焦点的控件。
    function renderDeduction(){
      deductionBox.replaceChildren();
      if(!player.deductionOpen){
        const trigger=el('button','扣分','deduction-trigger');trigger.type='button';trigger.setAttribute('aria-label',`为${player.name||'选手'+(index+1)}添加特殊扣分`);
        trigger.addEventListener('click',()=>{player.deductionOpen=true;renderDeduction();deductionBox.querySelector('input').focus();});deductionBox.append(trigger);
      }else{
        const deduction=el('input',undefined,'deduction num');deduction.type='number';deduction.min='0';deduction.step='any';deduction.value=player.deduction;deduction.placeholder='扣分';deduction.setAttribute('aria-label',`${player.name||'选手'+(index+1)}的特殊扣分`);
        deduction.addEventListener('input',()=>{player.deduction=deduction.value;updateCalculation();});
        deduction.addEventListener('blur',()=>{if(!deduction.validity.badInput&&(deduction.value.trim()===''||Number(deduction.value)===0)){player.deduction='';player.deductionOpen=false;renderDeduction();updateCalculation();}});
        deductionBox.append(deduction);
      }
    }
    renderDeduction();
    row.append(pick,score,rank,deductionBox,point);$('rows').append(row);
  });
  renderSeats();
}
function autoFillScore(changedIndex){
  if(autoScoreIndex!==null&&changedIndex!==autoScoreIndex){
    const others=players.filter((_,i)=>i!==autoScoreIndex);
    if(others.every(p=>validScore(p.score)))players[autoScoreIndex].score=String(100000-others.reduce((sum,p)=>sum+Number(p.score),0));
  }else if(autoScoreIndex===null){
    const blanks=players.map((p,i)=>String(p.score).trim()===''?i:-1).filter(i=>i>=0);
    if(blanks.length===1&&players.every((p,i)=>i===blanks[0]||validScore(p.score))){
      autoScoreIndex=blanks[0];players[autoScoreIndex].score=String(100000-players.reduce((sum,p,i)=>i===autoScoreIndex?sum:sum+Number(p.score),0));
    }
  }
  players.forEach((p,i)=>{const input=document.querySelector(`.player-row[data-row="${i}"] .score`);if(input){input.value=p.score;input.classList.toggle('auto-score',autoScoreIndex===i);}});
}
// 手动修正只执行一次；不将选中行设为持续自动补全的目标。
function correctSelectedScore(){
  if(!Number.isInteger(activeRow)||activeRow<0||activeRow>=players.length){notify('请先选中需要修正的选手行。',true);return;}
  const others=players.filter((_,index)=>index!==activeRow);
  if(!others.every(player=>validScore(player.score))){notify('请先填写其他三位选手的有效整数持点。',true);return;}
  const corrected=100000-others.reduce((sum,player)=>sum+Number(player.score),0);
  if(!validScore(corrected)){notify('修正后的持点超出允许范围，请检查其他三位选手的持点。',true);return;}
  autoScoreIndex=null;
  players[activeRow].score=String(corrected);
  document.querySelectorAll('.score').forEach((input,index)=>{input.value=players[index].score;input.classList.remove('auto-score');});
  updateCalculation();
  notify(`已将${players[activeRow].name||'第 '+(activeRow+1)+' 行选手'}的持点修正为 ${corrected.toLocaleString('en-US')}。`);
}
function renderSeats(){
  $('seats').replaceChildren();
  players.forEach((p,i)=>{
    const label=el('label',p.name||`选手 ${i+1}`),select=el('select');select.setAttribute('aria-label',`${p.name||'选手'+(i+1)}的开局座次`);
    const blank=el('option','请选择');blank.value='';select.append(blank);
    seatNames.forEach((name,n)=>{const option=el('option',name);option.value=String(n);select.append(option);});select.value=p.seat;
    select.addEventListener('change',()=>{p.seat=select.value;updateCalculation();});label.append(select);$('seats').append(label);
  });
}
function updateCalculation(){
  const state=calculate(players);
  $('tie-box').hidden=!state.hasTriple;
  $('score-total').textContent=players.every(p=>validScore(p.score))?players.reduce((sum,p)=>sum+Number(p.score),0).toLocaleString('en-US'):'—';
  players.forEach((p,i)=>{
    const result=state.result?.[i];$('rank-'+i).textContent=result?(result.tied?'并列':'')+result.rank:'—';
    const finalPoint=result?.point!=null&&validDeduction(p.deduction)?result.point-(p.deduction===''?0:Number(p.deduction)):null;
    const point=$('point-'+i);point.textContent=finalPoint!=null?formatPoint(finalPoint):'—';
    point.className='point num'+(finalPoint>0?' positive':finalPoint<0?' negative':'');
  });
  const total=players.every(p=>validScore(p.score))?players.reduce((sum,p)=>sum+Number(p.score),0):null;
  $('calculation-status').textContent=total!==null&&total!==100000?'持点合计必须为 100,000':state.ready?'':state.needsSeats?'等待补充起家顺序':'填写三人的持点后自动补全';
  $('calculation-status').hidden=!$('calculation-status').textContent;
  $('correct-score').disabled=!Number.isInteger(activeRow)||activeRow<0||activeRow>=players.length;
  $('tie-detail').textContent=state.needsSeats?'四人的座次不能重复。':state.tripleBonus?.map(x=>`${x.name||'未选选手'}：${formatPoint(x.bonus)}`).join(' / ')||'';
  $('game-id').textContent='gameId: '+(editingId===null?nextId:editingId);
}
function draftHasContent(){return $('info').value!==''||players.some(p=>p.name||p.score!=='25000'||p.deduction!=='');}
function resetEditor(){players=emptyPlayers();editingId=null;activeRow=0;autoScoreIndex=null;$('info').value='';$('editor-title').textContent='录入新比赛';$('save').textContent='保存本场，继续录入';$('cancel').hidden=true;renderRows();renderRoster();updateCalculation();}
function saveGame(){
  const info=$('info').value.trim();if(!info){notify('请填写比赛信息 info。',true);return;}
  if(players.some(p=>!p.name)){notify('请先选择四名选手。',true);return;}
  if(new Set(players.map(p=>p.name)).size!==4){notify('同一场不能重复选择选手。',true);return;}
  const selectedTeams=players.map(p=>teamFor(p.name));if(selectedTeams.some(team=>!team)){notify('选手不在当前名单中，请重新选择。',true);return;}
  if(new Set(selectedTeams.map(team=>team.name)).size!==4){notify('同一场的四名选手必须来自四支不同队伍。',true);return;}
  const state=calculate(players);if(!state.ready){notify(state.error,true);return;}
  if(players.reduce((sum,p)=>sum+Number(p.score),0)!==100000){notify('四人的持点合计必须为 100,000。',true);return;}
  if(players.some(p=>!validDeduction(p.deduction))){notify('特殊扣分不能为负数。',true);return;}
  const id=editingId===null?nextId:editingId;
  const game={gameId:id,info,players:players.map((p,i)=>({name:p.name,score:Number(p.score),teamPoint:state.result[i].point-(p.deduction===''?0:Number(p.deduction))}))};
  if(editingId===null){games.push(game);nextId++;}else games[games.findIndex(g=>g.gameId===id)]=game;
  seatHistory.set(id,players.map(p=>p.seat));unsaved=true;resetEditor();renderGames();notify(`已保存比赛 #${id}，可以继续录入。`);
}
function editGame(id){
  if(draftHasContent()&&!confirm('切换比赛会丢弃当前未保存的填写内容，继续吗？'))return;
  const game=games.find(g=>g.gameId===id);editingId=id;autoScoreIndex=null;players=game.players.map((p,i)=>({name:p.name,score:String(p.score),seat:seatHistory.get(id)?.[i]??'',deduction:'',deductionOpen:false}));
  const base=calculate(players);if(base.ready)players.forEach((p,i)=>{const deduction=base.result[i].point-game.players[i].teamPoint;p.deduction=deduction>0?String(deduction):'';p.deductionOpen=deduction>0;});
  $('info').value=game.info;activeRow=0;$('editor-title').textContent='修改比赛';$('save').textContent='保存修改';$('cancel').hidden=false;
  renderRows();renderRoster();updateCalculation();notify('');$('editor-title').scrollIntoView({behavior:'smooth',block:'center'});
}
function deleteGame(id){
  if(!confirm(`确定删除比赛 #${id} 吗？其他比赛编号保持不变。`))return;
  games=games.filter(g=>g.gameId!==id);seatHistory.delete(id);unsaved=true;if(editingId===id)resetEditor();renderGames();notify(`已删除比赛 #${id}。`);
}
function renderGames(){
  $('count').textContent=games.length;$('download').disabled=savingFile||!games.length;$('games-list').replaceChildren();
  if(!games.length){$('games-list').append(el('div','保存第一场比赛后，这里会显示比赛记录。','empty'));return;}
  games.forEach(game=>{
    const card=el('article',undefined,'game'),top=el('div',undefined,'game-top'),title=el('div',undefined,'game-title');
    title.append(el('span','#'+game.gameId,'game-id'),el('span',game.info||'未填写比赛信息'));
    const controls=el('div',undefined,'game-tools'),edit=el('button','修改','small'),remove=el('button','删除','small danger');
    edit.addEventListener('click',()=>editGame(game.gameId));remove.addEventListener('click',()=>deleteGame(game.gameId));controls.append(edit,remove);top.append(title,controls);
    const list=el('div',undefined,'game-players');game.players.forEach(p=>{const item=el('div');item.append(el('span',p.name),el('span',p.score.toLocaleString('en-US')+' 点','sub'),el('span',formatPoint(p.teamPoint),p.teamPoint<0?'negative':'positive'));list.append(item);});card.append(top,list);$('games-list').append(card);
  });
}
$('correct-score').addEventListener('click',correctSelectedScore);
$('save').addEventListener('click',saveGame);
function discardDraft(){if(draftHasContent()&&!confirm('确定放弃当前未保存的填写内容吗？'))return;resetEditor();notify('');}
$('reset').addEventListener('click',discardDraft);$('cancel').addEventListener('click',discardDraft);
// 导出时根据比赛信息重建日期标签，每个日期只标记当前列表中的第一场。
function serializeGames(){
  const dates=new Set();
  const output=games.map(game=>{
    const result={gameId:game.gameId,info:game.info};
    const match=game.info.match(/(?:^|[^\d])(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if(match){
      const month=Number(match[1]),day=Number(match[2]);
      const maxDays=[31,29,31,30,31,30,31,31,30,31,30,31];
      if(month>=1&&month<=12&&day>=1&&day<=maxDays[month-1]){
        const date=month+'/'+day;
        if(!dates.has(date)){result.labelx=date;dates.add(date);}
      }
    }
    result.players=game.players;
    return result;
  });
  return JSON.stringify({games:output},null,2)+'\n';
}
$('download').addEventListener('click',async()=>{
  if(savingFile)return;
  if(draftHasContent()&&!confirm('当前填写内容尚未保存。本次只下载下方已保存的比赛，继续吗？'))return;
  if(!window.isSecureContext||typeof window.showSaveFilePicker!=='function'){
    notify('当前页面无法打开另存为窗口。请使用最新版 Chrome，通过 HTTPS 网站、本地 HTML 文件或 localhost 打开页面。',true);return;
  }
  savingFile=true;$('download').disabled=true;
  let writable;
  try{
    // 在点击事件中直接打开系统另存为窗口，每次都由用户选择目录和文件名。
    const picker=window.showSaveFilePicker({suggestedName:'games.json',types:[{description:'JSON 比赛文件',accept:{'application/json':['.json']}}]});
    const content=serializeGames(),count=games.length;
    const handle=await picker;
    writable=await handle.createWritable();await writable.write(content);await writable.close();writable=null;
    // 写入期间若有新增、修改、删除或导入，不能误清除这些数据的未导出状态。
    const unchanged=content===serializeGames();
    if(unchanged)unsaved=false;
    notify(`已保存 ${handle.name}，共 ${count} 场比赛。`+(unchanged?'':'页面数据已变化，请再次保存最新内容。'));
  }catch(error){
    if(writable){try{await writable.abort();}catch{}}
    notify(error.name==='AbortError'?'已取消保存。':'保存失败：'+error.message,error.name!=='AbortError');
  }finally{savingFile=false;$('download').disabled=!games.length;}
});
// 导入只读取已有结果，不重新计分，也不要求或导出起家座次。
function parseGamesFile(text){
  const data=JSON.parse(text.replace(/^\uFEFF/,''));
  if(!data||!Array.isArray(data.games))throw new Error('需要包含 games 数组的比赛文件。');
  const ids=new Set();
  return data.games.map((game,index)=>{
    const label=`第 ${index+1} 场比赛`;
    if(!game||!Number.isSafeInteger(game.gameId)||game.gameId<0||game.gameId>=Number.MAX_SAFE_INTEGER)throw new Error(label+'的 gameId 必须是可继续递增的非负整数。');
    if(ids.has(game.gameId))throw new Error('存在重复的 gameId：'+game.gameId);ids.add(game.gameId);
    if(typeof game.info!=='string'||!Array.isArray(game.players)||game.players.length!==4)throw new Error(label+'需要 info 文本和四名选手。');
    const names=new Set();
    const importedPlayers=game.players.map(player=>{
      if(!player||typeof player.name!=='string'||!player.name.trim()||typeof player.score!=='number'||!validScore(player.score)||typeof player.teamPoint!=='number'||!Number.isFinite(player.teamPoint))throw new Error(label+'的选手姓名、持点或积分格式不正确。');
      if(names.has(player.name))throw new Error(label+'存在重复选手。');names.add(player.name);
      return {name:player.name,score:player.score,teamPoint:player.teamPoint};
    });
    return {gameId:game.gameId,info:game.info,players:importedPlayers};
  });
}
$('import-games').addEventListener('click',()=>$('games-file').click());
$('games-file').addEventListener('change',async event=>{
  const file=event.target.files[0];if(!file)return;
  $('import-games').disabled=true;
  try{
    const imported=parseGamesFile(await file.text());
    if((games.length||unsaved||draftHasContent()||editingId!==null)&&!confirm('导入将替换当前比赛列表，并清空当前填写内容。尚未导出的内容将被丢弃，继续吗？'))return;
    games=imported;nextId=games.reduce((next,game)=>Math.max(next,game.gameId+1),0);
    seatHistory.clear();unsaved=false;resetEditor();renderGames();
    notify(`已导入 ${games.length} 场比赛，可以从 gameId ${nextId} 继续录入。`);
  }catch(error){notify('导入失败：'+error.message,true);}
  finally{event.target.value='';$('import-games').disabled=false;}
});
$('import-teams').addEventListener('click',()=>$('teams-file').click());
$('teams-file').addEventListener('change',async event=>{
  const file=event.target.files[0];if(!file)return;
  try{
    const data=JSON.parse((await file.text()).replace(/^\uFEFF/,''));
    if(!Array.isArray(data.teams)||!data.teams.length||data.teams.some(t=>!t||typeof t.name!=='string'||!Array.isArray(t.players)||!t.players.length||t.players.some(n=>typeof n!=='string'||!n.trim())))throw new Error('名单格式不正确，需要 teams 数组和各队的 players 名字数组。');
    const names=data.teams.flatMap(t=>t.players);if(new Set(names).size!==names.length)throw new Error('名单中存在重复名字，请检查后重新导入。');
    teams=data.teams;renderRoster();notify('名单已更新，已录入的比赛保持不变。');
  }catch(error){notify('导入失败：'+error.message,true);}finally{event.target.value='';}
});
window.addEventListener('beforeunload',event=>{if(unsaved||draftHasContent()){event.preventDefault();event.returnValue='';}});
renderRows();renderRoster();renderGames();updateCalculation();
</script>
